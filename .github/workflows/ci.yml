name: Skill collection validation

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate collection distribution and documentation exports
        run: Scripts/check

  result:
    needs: validate
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful collection validation
        env:
          VALIDATE: ${{ needs.validate.result }}
        run: |
          test "$VALIDATE" = success
